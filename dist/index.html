
<html><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ping Pong Less</title><style>*{box-sizing:border-box}body{color:#fff;background:#171322;place-content:center;height:100dvh;margin:0;font:18px Times New Roman;display:grid;overflow:hidden}canvas{touch-action:none;border:3px solid #fff;width:100vw;height:70vh}p{text-align:center}button{background:#5af;padding:9px;font:700 18px Times New Roman}</style><canvas id=c></canvas><p id=t>YOU 0 - 0 CPU</p><button id=b>START / SERVE</button><script>
let g=c.getContext('2d'),W,H,P,y,a,x,z,dx=0,dy=0,v=4.8,s=0,q=0,go=0,d=1,k={},tr=[];
function size(){W=c.width=c.clientWidth;H=c.height=c.clientHeight;P=H*.17;y=y||H/2;a=a||H/2;x=x||W/2;z=z||H/2}size();onresize=size;
function reset(n){x=W/2;z=H/2;dx=dy=0;v=4.8;go=0;d=n}
function serve(){go||(go=1,dx=d*v,dy=(Math.random()-.5)*3)}
function pos(e){let r=c.getBoundingClientRect();y=Math.max(0,Math.min(H-P,(e.clientY-r.top)*H/r.height-P/2))}
c.onpointermove=pos;c.onpointerdown=e=>{pos(e);serve()};b.onclick=serve;
onkeydown=e=>{k[e.key]=1;if(e.code=='Space'){serve();e.preventDefault()}};onkeyup=e=>k[e.key]=0;
function f(a,b){g.fillStyle='#f8c';for(let[u,w]of[[-1,-1],[0,-1],[-2,0],[0,0],[-1,1]])g.fillRect(a+u*4,b+w*4,4,4);g.fillStyle='#fd4';g.fillRect(a-4,b,4,4)}
function draw(tm){let dt=Math.min((tm-(draw.l||tm))/16.7||1,2);draw.l=tm;if(k.ArrowUp||k.w)y-=7*dt;if(k.ArrowDown||k.s)y+=7*dt;y=Math.max(0,Math.min(H-P,y));
g.fillStyle='#278447';g.fillRect(0,0,W,H);g.fillStyle='#319653';for(let i=0;i<14;i++)for(let j=0;j<7;j++)if((i+j)%2==0)g.fillRect(i*W/14,j*H/7,W/14,H/7);
g.strokeStyle='white';g.lineWidth=3;g.strokeRect(1,1,W-2,H-2);g.setLineDash([12,12]);g.beginPath();g.moveTo(W/2,0);g.lineTo(W/2,H);g.stroke();g.setLineDash([]);
for(let i=0;i<Math.min(12,W/85);i++)f(i*137%W,i*197%H);
g.fillStyle='#43a5ff';g.fillRect(15,y,14,P);g.fillStyle='#b17aff';g.fillRect(W-29,a,14,P);
if(go){v=Math.min(9,v+.001*dt);let m=Math.hypot(dx,dy)||1;dx=dx/m*v;dy=dy/m*v;x+=dx*dt;z+=dy*dt;if(z<7||z>H-7)dy=-dy;z=Math.max(7,Math.min(H-7,z));a=Math.max(0,Math.min(H-P,a+Math.max(-3*dt,Math.min(3*dt,z-P/2-a))));
if(dx<0&&x<36&&x>15&&z>y-7&&z<y+P+7){x=36;dx=-dx;dy+=(z-y-P/2)*.035;v=Math.min(9,v+.18)}if(dx>0&&x>W-36&&x<W-15&&z>a-7&&z<a+P+7){x=W-36;dx=-dx;dy+=(z-a-P/2)*.025;v=Math.min(9,v+.18)}if(x< -8){q++;reset(1)}if(x>W+8){s++;reset(-1)}}
if(go){tr.push([x,z]);if(tr.length>v*3)tr.shift()}else tr=[];
tr.forEach((p,i)=>{g.globalAlpha=(i+1)/tr.length*.6;g.fillStyle='#9df';g.beginPath();g.arc(p[0],p[1],2+4*(i+1)/tr.length,0,7);g.fill()});g.globalAlpha=1;
g.fillStyle='white';g.beginPath();g.arc(x,z,7,0,7);g.fill();g.textAlign='center';g.font='bold 24px "Times New Roman"';g.fillText(s+' : '+q,W/2,30);t.textContent='YOU '+s+' - '+q+' CPU';requestAnimationFrame(draw)}draw(0);
</script></html>
